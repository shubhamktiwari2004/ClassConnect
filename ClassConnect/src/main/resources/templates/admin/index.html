<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassConnect - Dashboard</title>

    <link rel="icon" href="/img/kaiadmin/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />
    <script src="/js/plugin/webfont/webfont.min.js"></script>

    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"],
                urls: ["/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <style>
        /* General Styles */
        body {
            font-family: 'Public Sans', sans-serif;
            background: linear-gradient(to right, #d9e4f5, #f4f6f9);
            color: #333;
        }

        .container {
            margin-top: 40px;
        }

        h3 {
            font-size: 2rem;
            font-weight: 700;
            color: #495057;
            text-align: center;
        }

        /* Styled Table */
        .student-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .student-table th, .student-table td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .student-table th {
            background-color: #082474;
            color: white;
        }

        .student-table td {
            background-color: #f9f9f9;
        }

        .student-table td img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
        }

        .student-table .student-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .student-table .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .student-table .student-card p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .student-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: #007bff;
            color: white;
            padding: 5px;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .student-list-container {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{'admin/commonIncludes/leftNav.html' :: leftNavContent}"></div>

<div class="main-panel">
    <!-- Header -->
    <div th:replace="~{'admin/commonIncludes/header.html' :: headerContent}"></div>

    <div class="container">
        <div class="page-inner">
            <h3 class="fw-bold mb-4">Admin Dashboard</h3>

            <!-- Teacher Dropdown -->
            <div class="mb-3">
                <label for="teacherSelect" class="form-label fw-bold"><bold>Select a Teacher:</bold></label>
                <select id="teacherSelect" class="form-select">
                    <option value="">-- Choose a Teacher --</option>
                    <th:block th:each="teacher : ${teachers}">
                        <option th:value="${teacher.teacher_id}" th:text="${teacher.name}"></option>
                    </th:block>
                </select>
            </div>

            <!-- Student List Container -->
            <div id="studentListContainer" class="card p-4 d-none">
                <h4 class="mb-3"><i class="fas fa-users"></i> Students for <span id="selectedTeacher"></span></h4>

                <!-- Table for displaying students -->
                <table class="student-table">
                    <thead>
                    <tr>
                        <th>No.</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>

                <div class="load-more-btn">
                    <button id="loadMoreBtn" class="btn btn-primary btn-sm">Load More</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{'admin/commonIncludes/footer.html' :: footerContent}"></div>
</div>

<!-- Core JS Files -->
<script src="/js/core/jquery-3.7.1.min.js"></script>
<script src="/js/core/popper.min.js"></script>
<script src="/js/core/bootstrap.min.js"></script>

<script>
    $(document).ready(function() {
        // Event listener for teacher dropdown change
        $('#teacherSelect').change(function() {
            let teacherId = $(this).val();
            let teacherName = $("#teacherSelect option:selected").text();

            if (teacherId) {
                $('#selectedTeacher').text(teacherName);
                fetchStudents(teacherId);
            } else {
                $('#studentListContainer').addClass('d-none');
            }
        });

        // Load More Button Handler
        $('#loadMoreBtn').click(function() {
            let teacherId = $('#teacherSelect').val();
            loadMoreStudents(teacherId);
        });
    });

    function fetchStudents(teacherId) {
        $.ajax({
            url: '/admin/home/' + teacherId,
            method: 'GET',
            success: function(response) {
                let studentList = $('#studentList');
                let students = Array.isArray(response) ? response : response.students;

                if (students && students.length > 0) {
                    let studentRows = students.map((student, index) => {
                        let imageUrl = "http://class.connect.edu.in:8080/" + student.image_url;  // Correct path
                        return `
                            <tr>
                                <td>${index + 1}</td>
                                <td><div class="student-card"><img src="${imageUrl}" alt="Student Image" /></div></td>
                                <td><div class="student-card"><p><strong>${student.firstName} ${student.lastName}</strong></p></div></td>
                                <td><div class="student-card"><p>${student.email}</p></div></td>
                            </tr>
                        `;
                    }).join('');

                    studentList.html(studentRows);
                    $('#studentListContainer').removeClass('d-none');
                    $('#loadMoreBtn').show();
                } else {
                    studentList.html('<tr><td colspan="4" class="text-muted">No students available.</td></tr>');
                    $('#studentListContainer').removeClass('d-none');
                    $('#loadMoreBtn').hide();
                }
            },
            error: function() {
                $('#studentList').html('<tr><td colspan="4" class="text-danger">Failed to load students.</td></tr>');
                $('#studentListContainer').removeClass('d-none');
            }
        });
    }

    // Simulate loading more students (pagination or lazy load concept)
    function loadMoreStudents(teacherId) {
        // You would typically add offset and limit in your API call for pagination
        fetchStudents(teacherId);  // Placeholder: call fetch again for more students
    }
</script>

</body>
</html>
