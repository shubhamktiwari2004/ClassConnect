<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta
            content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
            name="viewport"
    />
    <link
            rel="icon"
            href="/img/kaiadmin/favicon.ico"
            type="image/x-icon"
    />

    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
          google: { families: ["Public Sans:300,400,500,600,700"] },
          custom: {
            families: [
              "Font Awesome 5 Solid",
              "Font Awesome 5 Regular",
              "Font Awesome 5 Brands",
              "simple-line-icons",
            ],
            urls: ["/css/fonts.min.css"],
          },
          active: function () {
            sessionStorage.fonts = true;
          },
        });
    </script>
    <style>
        /* Ensure the chart container takes up full height */
        .chart-container {
            position: relative;
            height: 300px; /* Adjust as needed */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Style for the message */
        .chart-message {
            position: absolute;
            font-size: 1.2rem;
            color: #6c757d; /* Bootstrap muted text color */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            z-index: 1; /* Ensure it's above the canvas */
            background-color: rgba(255, 255, 255, 0.8); /* Optional: Add a background for better visibility */
        }

        /* Hide canvas when no data is available */
        canvas {
            display: none;
        }
    </style>
    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
</head>

<div th:replace="~{'admin/commonIncludes/leftNav.html' :: leftNavContent}"></div>

    <!-- Header -->
    <div th:replace="~{'admin/commonIncludes/header.html' :: headerContent}"></div>

    <div class="container">
        <div class="page-inner">
            <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
                <h3 class="fw-bold mb-1">Dashboard</h3>
            </div>
            <!--        <div class="col-md-4">-->

            <!--          <select class="form-select" id="studentSelect" aria-label="Select a subject">-->
            <!--            <option selected disabled>Student Name</option>-->
            <!--            <th:block th:each="student : ${students}">-->
            <!--              <option th:value="${student.student_id}"-->
            <!--                      th:text="${student.firstName} + ' ' + ${student.lastName}"></option>-->
            <!--            </th:block>-->
            <!--          </select>-->
            <!--        </div>-->

            <div class="row mt-4">
                <!-- Bar Chart Card -->

            </div>
        </div>
    </div>
    <!-- Footer -->
    <div th:replace="~{'admin/commonIncludes/footer.html' :: footerContent}"></div>
</div>
<!-- Core JS Files -->
<script src="/js/core/jquery-3.7.1.min.js"></script>
<script src="/js/core/popper.min.js"></script>
<script src="/js/core/bootstrap.min.js"></script>
<!-- Chart JS -->
<script src="/js/plugin/chart.js/chart.min.js"></script>
<!-- Other Plugins -->
<script src="/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script>
<script src="/js/plugin/jquery.sparkline/jquery.sparkline.min.js"></script>
<script src="/js/plugin/sweetalert/sweetalert.min.js"></script>
<script src="/js/kaiadmin.min.js"></script>
<script>
    $(document).ready(function() {
      $.notify({
        icon: 'fa fa-info-circle',
        title: 'Welcome!',
        message: 'Welcome to Dashboard.'
      }, {
        type: 'info',
        delay: 2000,
        placement: {
          from: "top",
          align: "right"
        },
        offset: {
          x: 20,

        }
      });
    });
