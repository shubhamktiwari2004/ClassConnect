<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="/img/kaiadmin/favicon.ico" type="image/x-icon" />

    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
        WebFont.load({
          google: { families: ["Public Sans:300,400,500,600,700"] },
          custom: {
            families: [
              "Font Awesome 5 Solid",
              "Font Awesome 5 Regular",
              "Font Awesome 5 Brands",
              "simple-line-icons",
            ],
            urls: ["/css/fonts.min.css"],
          },
          active: function () {
            sessionStorage.fonts = true;
          },
        });
    </script>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />
    <link rel="stylesheet" href="/css/demo.css" />
    <style>
        body {
          font-family: 'Public Sans', sans-serif;
          background-color: #f5f7fd;
          margin: 0;
          padding: 0;
        }

        .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 20px;
        }

        .nav-tabs {
          display: flex;
          border-bottom: 2px solid #ddd;
          width: 100%;
        }

        .nav-tabs .nav-link {
          flex: 1;
          text-align: center;
          background: #f9f9f9;
          color: #333;
          font-weight: bold;
          padding: 12px;
          border: none;
          border-radius: 0;
          margin-right: 0; /* Remove margin between tabs */
        }

        .nav-tabs .nav-link:not(:last-child) {
          border-right: 1px solid #ddd; /* Add divider between tabs */
        }

        .nav-tabs .nav-link.active {
          background: #fff;
          border: 2px solid #ddd;
          border-bottom: none;
          color: #000;
        }

        .tab-content {
          border: 2px solid #ddd;
          background: #fff;
          padding: 20px;
          margin-top: -2px;
        }

        .tab-card {
          padding: 10px;
          background: #f7f7f7;
          border-radius: 8px;
        }

        .schedule-card {
          box-sizing: border-box;
          border-radius: 12px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
          background: #fff;
          padding: 20px;
          transition: transform 0.3s, box-shadow 0.3s;
          width: 48%;
          margin: 10px 1%;
        }

        .schedule-card:hover {
          transform: translateY(-7px);
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .schedule-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 15px;
        }

        .date-highlight {
          color: #ff7f50;
          font-weight: bold;
          font-size: 1.2em;
        }

        .topic-badge {
          background-color: #ff7f50;
          color: #fff;
          padding: 5px 10px;
          border-radius: 6px;
          font-size: 0.9em;
        }

        .time-info {
          margin-top: 15px;
          background: #f3f4f6;
          padding: 10px;
          border-radius: 8px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
          .nav-tabs {
            flex-direction: column; /* Stack tabs vertically */
          }

          .nav-tabs .nav-link {
            margin-bottom: 5px; /* Add spacing between vertical tabs */
            font-size: 1rem;
            padding: 10px;
          }

          .schedule-card {
            width: 100%;
            margin: 10px 0;
          }

          .tab-content {
            padding: 15px;
          }
        }

        @media (max-width: 576px) {
          .nav-tabs .nav-link {
            font-size: 0.85rem; /* Smaller font size on extra small screens */
            padding: 8px;
          }

          .schedule-header h3 {
            font-size: 1rem;
          }

          .topic-badge {
            font-size: 0.8em;
            padding: 4px 8px;
          }
        }
    @media (min-width: 768px) {
      .nav-tabs .nav-link {
        width: 50%; /* On medium and larger screens, make each tab 50% of the width */
      }
    }

    @media (min-width: 992px) {
      .nav-tabs .nav-link {
        width: 509px; /* Fixed width for larger screens */
      }
    }
    </style>

</head>
<body>
<!-- Sidebar -->
<div th:replace="~{'admin/commonIncludes/leftNav.html' :: leftNavContent}"></div>

<div class="main-panel">
    <div th:replace="~{'admin/commonIncludes/header.html' :: headerContent}"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="page-inner">
            <div class="d-flex align-items-center justify-content-between pt-2 pb-4">
                <h3 class="fw-bold mb-3">Teacher</h3>
                <!-- Add Teacher Button -->
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTeacherModal">
                    Add Teacher
                </button>
            </div>

            <!-- Teacher Modal -->
            <div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="alert alert-danger" th:if="${errorMessage}">
                            <p th:text="${errorMessage}"></p>
                        </div>
                        <div class="modal-header">
                            <h5 class="modal-title" id="addTeacherModalLabel">Add Teacher</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form method="post" th:action="@{/admin/addTeacher}" enctype="multipart/form-data">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="teacherName" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="teacherName" name="teachername" placeholder="Enter name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="teacherEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="teacherEmail" name="email" placeholder="Enter email" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="teacherMobile" class="form-label">Mobile</label>
                                        <input type="tel" class="form-control" id="teacherMobile" name="phoneno" placeholder="Enter mobile" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="teacherUsername" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="teacherUsername" name="username" placeholder="Enter username" required>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label for="teacherAddress" class="form-label">Address</label>
                                        <textarea class="form-control" id="teacherAddress" rows="3" name = "address" placeholder="Enter address"></textarea>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label for="teacherImage" class="form-label">Profile Image</label>
                                        <input type="file" class="form-control" name="teacherImage" id="teacherImage" onchange="previewImage(event)">
                                        <img id="teacherImagePreview" src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Profile Image Preview" style="margin-top:10px;" class="rounded-circle"
                                             width="70"
                                             height="70">
                                    </div>

                                </div>
                                <div class="modal-footer">
                                    <input type="hidden" name="teacher_id" id="teacher_id" value="HHHHH">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Teacher List Table -->
            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">Teacher List</h5>
                    <table class="table table-hover table-striped">
                        <thead class="table-primary">
                        <tr>
                            <th>S.No.</th>
                            <th>Profile</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="teacherList">
                        <!-- Example Row -->
                        <tr th:each="teacher , iterStat : ${teachers}">
                            <td th:text="${iterStat.index+1}"></td>
                            <td>
                                <img th:src="@{${teacher.profile_image != null ? @environment.getProperty('app.base-url') + teacher.profile_image : 'https://bootdey.com/img/Content/avatar/avatar7.png'}}" alt="Profile Image"
                                     class="rounded-circle"
                                     width="40"
                                     height="40"/>
                            </td>
                            <td th:text="${teacher.name ?: 'No Name'}">John Doe</td> <!-- Use 'No Name' if name is null -->
                            <td th:text="${teacher.email ?: 'No Email'}">john.doe@example.com</td> <!-- Use 'No Email' if email is null -->
                            <td th:text="${teacher.mobile ?: 'No Phone'}">+1234567890</td>

                            <td>
                                <!-- Edit button with pencil icon -->
                                <a class="btn btn-sm btn-outline-secondary editTeacherBtn"
                                   href="#"
                                   th:data-id="${teacher.teacher_id}">
                                    <i class="fas fa-pencil-alt"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/deleteTeacher/{teacher_id}(teacher_id=${teacher.teacher_id})}" title="Delete" onclick="return confirm('Are you sure you want to delete this student?')">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{'admin/commonIncludes/footer.html' :: footerContent}"></div>
</div>


<!-- Core JS -->
<script src="/js/core/jquery-3.7.1.min.js"></script>
<script src="/js/core/popper.min.js"></script>
<script src="/js/core/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

<script>
    function previewImage(event) {
    const file = event.target.files[0];  // Get the selected file
    const reader = new FileReader();  // Create a FileReader instance

    reader.onload = function(e) {
        // Set the image source to the file the user selected
        $('#teacherImagePreview').attr('src', e.target.result);
    };

    if (file) {
        reader.readAsDataURL(file);  // Read the selected file as a Data URL
    }
}


    var baseUrl = 'http://class.connect.edu.in:8080/';  // Set the base URL dynamically from Thymeleaf
    $(document).ready(function() {
         $("#addTeacherModal").on("show.bs.modal", function (e) {
            // Check if the event is triggered by the "Add Teacher" button
            if ($(e.relatedTarget).hasClass("btn-primary")) {
                // Clear the modal input fields
                $('#teacher_id').val('');
                $('#teacherName').val('');
                $('#teacherEmail').val('');
                $('#teacherMobile').val('');
                $('#teacherUsername').val('');
                $('#teacherAddress').val('');
                $('#teacherImagePreview').attr('src', 'https://bootdey.com/img/Content/avatar/avatar7.png'); // Reset image preview
                $('#teacherImage').val(''); // Clear file input
            }
        });
    
        // When the edit button is clicked
        $(".editTeacherBtn").click(function(event) {
            event.preventDefault();  // Prevent the default anchor tag behavior

            // Get the teacher id from the data-id attribute
            var teacherId = $(this).data('id');

            // Send an AJAX request to fetch teacher data
            $.ajax({
                url: '/admin/teacher/edit/' + teacherId,  // Adjust the URL based on your controller
                type: 'GET',  // Make sure to use GET to fetch data
                success: function(response) {
                    // Populate the modal fields with the teacher's data
                    $('#teacher_id').val(response.teacher_id);
                    $('#teacherName').val(response.name);
                    $('#teacherEmail').val(response.email);
                    $('#teacherMobile').val(response.mobile);
                    $('#teacherUsername').val(response.username);
                    $('#teacherAddress').val(response.address);
                     if (response.profile_image) {
                        $('#teacherImagePreview').attr('src', baseUrl + response.profile_image);  // Show image in the modal
                    } else {
                        $('#teacherImagePreview').attr('src', 'https://bootdey.com/img/Content/avatar/avatar7.png');  // Default image
                    }// Assuming you have an input for image

                    // Show the modal
                    $('#addTeacherModal').modal('show');
                },
                error: function(xhr, status, error) {
                    console.log('Error fetching teacher data:', error);
                }
            });
        });
    });

</script>
</body>
</html>
