<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport"/>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Include Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <!-- Include toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>

      <!-- End Sidebar -->

      <div class="main-panel">
        <!-- Include header -->
        <div th:replace="~{'teachers/commonIncludes/header.html' :: headerContent}"></div>

        <div class="container">
          <div class="page-inner">
            <div class="card">
              <div class="card-header bg-secondary text-white">
                <h4>Student Information</h4>
              </div>
              <div>
                <div class="card-body">
                  <!-- Profile Image -->
                  <!-- Profile Image Section -->
                  <form id="studentCardForm" method="POST" th:action="@{/teacher/students}" enctype="multipart/form-data">

                  <div class="d-flex flex-column align-items-center mb-4">
                    <!-- Profile Image -->
                    <div class="position-relative">
                      <img id="profileImagePreview"
                              th:src="@{${(student_data != null && !student_data.isEmpty() && student_data[0].image_url != null && !student_data[0].image_url.isEmpty())
                              ? '/' + student_data[0].image_url
                              : 'https://bootdey.com/img/Content/avatar/avatar7.png'}}"
                              alt="Profile Image"
                              class="rounded-circle"
                              style="width: 100px; height: 100px; object-fit: cover; cursor: pointer; border: 2px solid #ddd;"
                              onclick="document.getElementById('studentImage').click();"
                      >
                      <input
                              type="file"
                              id="studentImage"
                              name="studentImage"
                              accept="image/*"
                              style="display: none;"
                              onchange="previewProfileImage(event)"
                              required
                      >
                    </div>
                    <!-- Label Below the Image -->
                    <small class="text-muted mt-2">Upload Student Image</small>
                  </div>

                  <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name"
                           th:value="${student_data != null ? student_data[0].firstName : ''}" required>
                  </div>
                  <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter last name"
                           th:value="${student_data != null ? student_data[0].lastName : ''}" required>
                  </div>
                  <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter email ID"
                           th:value="${student_data != null ? student_data[0].email : ''}" required>
                  </div>
                  <div class="form-group">
                    <label for="address">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter address" th:text="${student_data != null ? student_data[0].address : ''}" required>
                    </textarea>
                  </div>
                </form>
              </div>
              </div>
            </div>

              <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-secondary me-2" onclick="closeForm()">Close</button>
                <button type="submit" class="btn btn-primary" form="studentCardForm">Submit</button>
              </div>

            <div class="card mt-2">
              <div class="card-header bg-info text-white">
                <h4>Student Marks</h4>
              </div>
              <div>
                <div class="card-body">
                  <form th:action="@{/teachers/save_marks}" method="POST">
                  <div class="table-responsive mt-4">
                    <table class="table">
                      <tr>
                        <th>S.No.</th>
                        <th>Subject</th>
                        <th>Unit 1</th>
                        <th>Sem 1</th>
                        <th>Unit 2</th>
                        <th>Sem 2</th>
                        <th>Total</th>
                      </tr>
                      <tr>
                        <td>1</td>
                        <th>Maths</th>
                        <td><input type="number" class="form-control" name="unit1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="unit2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="total" value="0" min="1" max="100"></td>
                        <input type="hidden" name="student_id" th:value="${id}"/>

                        <input type="hidden" name="subject" value="Maths">

                      </tr>
                      <tr>
                        <td>2</td>
                        <th>Science</th>
                        <td><input type="number" class="form-control" name="unit1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="unit2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="total" value="0" min="1" max="100"></td>
                        <input type="hidden" name="student_id" th:value="${id}"/>
                        <input type="hidden" name="subject" value="Science">

                      </tr>
                      <tr>
                        <td>3</td>
                        <th>Hindi</th>
                        <td><input type="number" class="form-control" name="unit1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="unit2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="total" value="0" min="1" max="100"></td>
                        <input type="hidden" name="student_id" th:value="${id}"/>

                        <input type="hidden" name="subject" value="Hindi">

                      </tr>
                      <tr>
                        <td>4</td>
                        <th>English</th>
                        <td><input type="number" class="form-control" name="unit1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem1" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="unit2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="sem2" value="0" min="1" max="100"></td>
                        <td><input type="number" class="form-control" name="total" value="0" min="1" max="100"></td>
                        <input type="hidden" name="student_id" th:value="${id}"/>

                        <input type="hidden" name="subject" value="English">
                      </tr>
                    </table>
                  </div>
                    <div class="d-flex justify-content-end">
                      <button type="submit" class="btn btn-primary" id="save_marks" name="save_marks">Save Marks</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
<!--            <div class="d-flex justify-content-end">-->
<!--              <button type="submit" class="btn btn-primary" id="save_marks" name="save_marks">Save Marks</button>-->
<!--            </div>-->
            <input type="hidden" id="classDivisionId" th:value="${classDivisionId}">

            <!-- Modal Structure -->
            <div class="modal fade" id="addStudentModal" tabindex="-1" role="dialog" aria-labelledby="addStudentModalLabel" aria-hidden="true">
              <div class="modal-dialog" role="document">
                <div class="modal-content">
                  <div class="modal-header">
                  </div>
                  <div class="modal-body">
                    <!-- Form Inside Modal -->
                    <form id="studentform">
                      <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" class="form-control" id="studentName" placeholder="Enter name">
                      </div>
                      <div class="form-group">
                        <label for="RollNo">Roll No.</label>
                        <input type="text" class="form-control" id="RollNo" placeholder="Enter name">
                      </div>
                      <div class="form-group">
                        <label for="mathsMarks">Maths Marks</label>
                        <input type="number" class="form-control" id="mathsMarks" placeholder="Maths marks">
                      </div>
                      <div class="form-group">
                        <label for="scienceMarks">Science Marks</label>
                        <input type="number" class="form-control" id="scienceMarks" placeholder="Science marks">
                      </div>
                      <div class="form-group">
                        <label for="hindiMarks">Hindi Marks</label>
                        <input type="number" class="form-control" id="hindiMarks" placeholder="Hindi marks">
                      </div>
                      <div class="form-group">
                        <label for="englishMarks">English Marks</label>
                        <input type="number" class="form-control" id="englishMarks" placeholder="English marks">
                      </div>
                      <div class="form-group">
                        <label for="totalMarks">Total Marks</label>
                        <input type="number" class="form-control" id="totalMarks" placeholder="Total marks">
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" id="save" class="btn btn-primary">Save changes</button>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>



</div>
</div>

    function previewProfileImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
          const output = document.getElementById('profileImagePreview');
          output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }

       $(document).ready(function() {
                var successMessage = /*[[${success}]]*/ '';
                var errorMessage = /*[[${error}]]*/ '';

                if (successMessage) {
                    toastr.success(successMessage);
                }
                if (errorMessage) {
                    toastr.error(errorMessage);
