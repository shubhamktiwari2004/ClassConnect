<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
      name="viewport"
    />
      <link rel="icon" href="/img/kaiadmin/ClassConnect Logo.png" type="image/x-icon" />


      <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- Include Sidebar -->
      <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>
      <!-- End Sidebar -->

      <div class="main-panel">
        <!-- Include header -->
        <div th:replace="~{'teachers/commonIncludes/header.html' :: headerContent}"></div>

        <div class="container">
          <div class="page-inner">
            <div class="d-flex align-items-center justify-content-between flex-wrap pt-2 pb-4">
              <h3 class="fw-bold mb-0 me-3">Schedule</h3>
            </div>

            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Post Daily Schedule</h4>
              </div>
              <div class="card-body">
                <div id="submissionMessage" style="color: green; display: none;"></div> <!-- Submission message element -->

                <form method="POST" action="/teachers/schedule/editPost">
s
                  <input type="hidden" th:value="${scheduleById[0].schedule_id}" name="schedule_id">

                  <input type="hidden" th:value="${scheduleById[0].teacherId}" name="TeacherId">

                  <!-- Class Name -->
                  <div class="form-group">
                    <label for="editClassName">Class Name</label>
                    <input type="text" class="form-control" id="editClassName" name="className" th:value="${scheduleById[0].className}" placeholder="Enter class name, e.g., Class 10A" required>
                  </div>

                  <!-- Subject -->
                  <div class="form-group">
                    <label for="editSubject">Subject</label>
                    <input type="text" class="form-control" id="editSubject" name="subject" th:value="${scheduleById[0].subject}" placeholder="Enter subject, e.g., Mathematics" required>
                  </div>

                  <!-- Date -->
                  <div class="form-group">
                    <label for="editDate">Date</label>
                    <input type="date" class="form-control" id="editDate" name="date" th:value="${scheduleById[0].date}" required>
                  </div>

                  <!-- Start Time -->
                  <div class="form-group">
                    <label for="editStartTime">Start Time</label>
                    <input type="time" class="form-control" id="editStartTime" name="startTime" th:value="${scheduleById[0].startTime}" required>
                  </div>

                  <!-- End Time -->
                  <div class="form-group">
                    <label for="editEndTime">End Time</label>
                    <input type="time" class="form-control" id="editEndTime" name="endTime" th:value="${scheduleById[0].endTime}" required>
                  </div>

                  <!-- Topic -->
                  <div class="form-group">
                    <label for="editTopic">Topic</label>
                    <input type="text" class="form-control" id="editTopic" name="topic" th:value="${scheduleById[0].topic}" placeholder="Brief topic description" required>
                  </div>

                  <!-- Room Number (Optional) -->
                  <div class="form-group">
                    <label for="editRoomNumber">Room Number</label>
                    <input type="text" class="form-control" id="editRoomNumber" name="roomNumber" th:value="${scheduleById[0].roomNumber}" placeholder="Enter room number if applicable">
                  </div>

                  <!-- Notes (Optional) -->
                  <div class="form-group">
                    <label for="editNotes">Additional Notes</label>
                    <textarea class="form-control" id="editNotes" name="notes" rows="3" th:text="${scheduleById[0].notes}" placeholder="Add any additional notes here"></textarea>
                  </div>

                  <!-- Submit Button -->
                  <button type="submit" class="btn btn-primary mt-3">Post Schedule</button>
                </form>
              </div>
            </div>


          </div>
        </div>






      </div>


    </div>
    <!--   Core JS Files   -->
    <script src="/js/core/jquery-3.7.1.min.js"></script>
    <script src="/js/core/popper.min.js"></script>
    <script src="/js/core/bootstrap.min.js"></script>

    <!-- jQuery Scrollbar -->
    <script src="/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script>

    <!-- Chart JS -->
    <script src="/js/plugin/chart.js/chart.min.js"></script>

    <!-- jQuery Sparkline -->
    <script src="/js/plugin/jquery.sparkline/jquery.sparkline.min.js"></script>

    <!-- Chart Circle -->
    <script src="/js/plugin/chart-circle/circles.min.js"></script>

    <!-- Datatables -->
    <script src="/js/plugin/datatables/datatables.min.js"></script>

    <!-- Bootstrap Notify -->
    <script src="/js/plugin/bootstrap-notify/bootstrap-notify.min.js"></script>

    <!-- jQuery Vector Maps -->
    <script src="/js/plugin/jsvectormap/jsvectormap.min.js"></script>
    <script src="/js/plugin/jsvectormap/world.js"></script>

    <!-- Sweet Alert -->
    <script src="/js/plugin/sweetalert/sweetalert.min.js"></script>

    <!-- Kaiadmin JS -->
    <script src="/js/kaiadmin.min.js"></script>

    <!-- Kaiadmin DEMO methods, don't include it in your project! -->
    <script src="/js/setting-demo.js"></script>
    <script src="/js/demo.js"></script>
    <script>
      $(document).ready(function() {
        $.notify({
          // Notification content
          icon: 'fa fa-info-circle', // Optional icon
          title: 'Welcome!',
          message: 'Welcome to Schedule.',
        }, {
          // Notification options
          type: 'info',  // Type can be 'info', 'success', 'warning', 'danger'
          delay: 2000,  // Time in milliseconds before it disappears
          placement: {
            from: "top",
            align: "right"
          },
          offset: {
            x: 20, // X offset for positioning
            y: 60  // Y offset for positioning
          }
        });
      });
    </script>

    <script>
      $("#lineChart").sparkline([102, 109, 120, 99, 110, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#177dff",
        fillColor: "rgba(23, 125, 255, 0.14)",
      });

      $("#lineChart2").sparkline([99, 125, 122, 105, 110, 124, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#f3545d",
        fillColor: "rgba(243, 84, 93, .14)",
      });

      $("#lineChart3").sparkline([105, 103, 123, 100, 95, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#ffa534",
        fillColor: "rgba(255, 165, 52, .14)",
      });
    </script>
  </body>
</html>
