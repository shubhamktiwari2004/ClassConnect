<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
      name="viewport"
    />
    <link
      rel="icon"
      href="/img/kaiadmin/favicon.ico"
      type="image/x-icon"
    />

    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
  </head>
  <body>

  <style>
    .cards-container {
       display: flex;
       flex-direction: column;
       gap: 20px;
       padding: 20px;
       width: 100%;
       box-sizing: border-box; /* Ensure padding is included in width calculations */

   }

   .card {
       display: flex;
       flex-direction: column;
       background-color: #fff;
       border-radius: 10px;
       box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
       padding: 20px;
       transition: transform 0.2s ease-in-out;
       max-width: 100%;
       width: 100%;
       background: linear-gradient(135deg, #f5f5f5 0%, #eaeaea 100%);

   }

   .card:hover {
       transform: scale(1.02);
       box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

   }

   .date-highlight {
       color: orange;
       font-weight: bold;
       margin-bottom: 10px;
   }

   .card-content {
       display: flex;
       flex-direction: column;
       gap: 8px;
   }

   .time-info {
       display: flex;
       justify-content: space-between;
       margin-top: 10px;
   }

   .card p {
       margin: 5px 0;
       font-size: 1em;
   }

   .card p strong {
       color: #333;
   }

  </style>


    <div class="wrapper">
      <!-- Sidebar -->
      <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>
      <!-- End Sidebar -->

      <div class="main-panel">
        <!-- Include header -->
        <div th:replace="~{'teachers/commonIncludes/header.html' :: headerContent}"></div>

        <div class="container">

          <div class="page-inner">
            <div class="d-flex align-items-center justify-content-between flex-wrap pt-2 pb-4">
              <h3 class="fw-bold mb-0 me-3">Schedule</h3>
              <button class="btn btn-success" onclick="window.location.href='/teachers/addSchedule'">Add Schedule</button>
            </div>
          </div>

          <div class="cards-container">
            <div th:each="schedule : ${schedules}" class="card">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="date-highlight" th:text="${schedule.date}" style="color: orange; font-weight: bold;"></h3>
                <p>Schedule ID: [[${schedule.schedule_id}]] </p>
                <a th:href="@{/teachers/schedule/edit/{schedule_id}(schedule_id=${schedule.schedule_id})}" class="edit-button">
                  <i class="fas fa-edit"></i> Edit
                </a>

              </div>
              <div class="card-content">
                <p><strong>📘 Subject:</strong> <span th:text="${schedule.subject}"></span></p>
                <p><strong>🏫 Class:</strong> <span th:text="${schedule.className}"></span></p>
                <p><strong>📑 Topic:</strong> <span th:text="${schedule.topic}"></span></p>
                <p><strong>📍 Room Number:</strong> <span th:text="${schedule.roomNumber}"></span></p>
                <p><strong>📝 Notes:</strong> <span th:text="${schedule.notes}"></span></p>
                <div class="time-info">
                  <p><strong>⏰ Start Time:</strong> <span th:text="${schedule.startTime}"></span></p>
                  <p><strong>⏰ End Time:</strong> <span th:text="${schedule.endTime}"></span></p>
                </div>
              </div>
            </div>
          </div>

          <div th:if="${message}" th:text="${message}" id="popup-message" style="display: none;"></div>


        </div>




      </div>





    </div>
    <!--   Core JS Files   -->
    <script src="/js/core/jquery-3.7.1.min.js"></script>
    <script src="/js/core/popper.min.js"></script>
    <script src="/js/core/bootstrap.min.js"></script>

    <!-- jQuery Scrollbar -->
    <script src="/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script>

    <!-- Chart JS -->
    <script src="/js/plugin/chart.js/chart.min.js"></script>

    <!-- jQuery Sparkline -->
    <script src="/js/plugin/jquery.sparkline/jquery.sparkline.min.js"></script>

    <!-- Chart Circle -->
    <script src="/js/plugin/chart-circle/circles.min.js"></script>

    <!-- Datatables -->
    <script src="/js/plugin/datatables/datatables.min.js"></script>

    <!-- Bootstrap Notify -->
    <script src="/js/plugin/bootstrap-notify/bootstrap-notify.min.js"></script>

    <!-- jQuery Vector Maps -->
    <script src="/js/plugin/jsvectormap/jsvectormap.min.js"></script>
    <script src="/js/plugin/jsvectormap/world.js"></script>

    <!-- Sweet Alert -->
    <script src="/js/plugin/sweetalert/sweetalert.min.js"></script>

    <!-- Kaiadmin JS -->
    <script src="/js/kaiadmin.min.js"></script>

    <!-- Kaiadmin DEMO methods, don't include it in your project! -->
    <script src="/js/setting-demo.js"></script>
    <script src="/js/demo.js"></script>
    <script>
      $(document).ready(function() {
        $.notify({
          // Notification content
          icon: 'fa fa-info-circle', // Optional icon
          title: 'Welcome!',
          message: 'Welcome to Schedule.',
        }, {
          // Notification options
          type: 'info',  // Type can be 'info', 'success', 'warning', 'danger'
          delay: 2000,  // Time in milliseconds before it disappears
          placement: {
            from: "top",
            align: "right"
          },
          offset: {
            x: 20, // X offset for positioning
            y: 60  // Y offset for positioning
          }
        });
      });
    </script>

    <script>
      $("#lineChart").sparkline([102, 109, 120, 99, 110, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#177dff",
        fillColor: "rgba(23, 125, 255, 0.14)",
      });

      $("#lineChart2").sparkline([99, 125, 122, 105, 110, 124, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#f3545d",
        fillColor: "rgba(243, 84, 93, .14)",
      });

      $("#lineChart3").sparkline([105, 103, 123, 100, 95, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#ffa534",
        fillColor: "rgba(255, 165, 52, .14)",
      });
    </script>
    <script>
      window.addEventListener("DOMContentLoaded", function() {
          var messageElement = document.getElementById("popup-message");
          if (messageElement && messageElement.textContent.trim() !== "") {
              alert(messageElement.textContent);
          }
      });
    </script>

    </body>
  </html>
