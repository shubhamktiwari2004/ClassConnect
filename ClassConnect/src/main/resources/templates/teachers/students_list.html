<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport"/>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Include Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>

      <!-- End Sidebar -->

      <div class="main-panel">
        <!-- Include header -->
        <div th:replace="~{'teachers/commonIncludes/header.html' :: headerContent}"></div>

        <div class="container">
          <div class="page-inner">
              <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
                <div>
                  <h3 class="fw-bold mb-3">Students</h3>
                </div>
              </div>
            <div style="display: flex; justify-content: flex-end;">
              <button class="btn btn-primary" id="addStudentModalLabel" data-toggle="modal" data-target="#addStudentModal">
                <i class="fas fa-plus" style="margin-right: 5px;"></i> Add Student
              </button>

            </div>
              <div class="table-responsive mt-4">
                <table class="table">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Maths Marks</th>
                    <th>Science Marks</th>
                    <th>Hindi Marks</th>
                    <th>English Marks</th>
                    <th>Total Marks</th>
                  </tr>
                  <tr th:each="student : ${students}">
                    <td th:text="${student.roll_no}">Roll No.</td>
                    <td th:text="${student.students_name}">Name</td>
                    <td th:text="${student.maths_marks}">Maths Marks</td>
                    <td th:text="${student.science_marks}">Science Marks</td>
                    <td th:text="${student.hindi_marks}">Hindi Marks</td>
                    <td th:text="${student.english_marks}">English Marks</td>
                    <td th:text="${student.total_marks}">Total Marks</td>
                  </tr>
                </table>
              </div>
            <input type="hidden" id="classDivisionId" th:value="${classDivisionId}">

            <!-- Modal Structure -->
            <div class="modal fade" id="addStudentModal" tabindex="-1" role="dialog" aria-labelledby="addStudentModalLabel" aria-hidden="true">
              <div class="modal-dialog" role="document">
                <div class="modal-content">
                  <div class="modal-header">
                  </div>
                  <div class="modal-body">
                    <!-- Form Inside Modal -->
                    <form id="studentform">
                      <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" class="form-control" id="studentName" placeholder="Enter name">
                      </div>
                      <div class="form-group">
                        <label for="RollNo">Roll No.</label>
                        <input type="text" class="form-control" id="RollNo" placeholder="Enter name">
                      </div>
                      <div class="form-group">
                        <label for="mathsMarks">Maths Marks</label>
                        <input type="number" class="form-control" id="mathsMarks" placeholder="Maths marks">
                      </div>
                      <div class="form-group">
                        <label for="scienceMarks">Science Marks</label>
                        <input type="number" class="form-control" id="scienceMarks" placeholder="Science marks">
                      </div>
                      <div class="form-group">
                        <label for="hindiMarks">Hindi Marks</label>
                        <input type="number" class="form-control" id="hindiMarks" placeholder="Hindi marks">
                      </div>
                      <div class="form-group">
                        <label for="englishMarks">English Marks</label>
                        <input type="number" class="form-control" id="englishMarks" placeholder="English marks">
                      </div>
                      <div class="form-group">
                        <label for="totalMarks">Total Marks</label>
                        <input type="number" class="form-control" id="totalMarks" placeholder="Total marks">
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" id="save" class="btn btn-primary">Save changes</button>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>



</div>
</div>
<!--      <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>-->

<!--      &lt;!&ndash;    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>&ndash;&gt;-->
<!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>-->
<!--    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>-->
    <script>
      // Attach click event to the save button
      $('#save').on('click', function () {
        // Gather form data
        const formData = {
          RollNo:$('#RollNo').val(),
          classDivisionsId:$('#classDivisionId').val(),
          studentName: $('#studentName').val(),
          mathsMarks: $('#mathsMarks').val(),
          scienceMarks: $('#scienceMarks').val(),
          hindiMarks: $('#hindiMarks').val(),
          englishMarks: $('#englishMarks').val(),
          totalMarks: $('#totalMarks').val(),
        };
        console.log(formData);

        // Send data to the controller via AJAX
        $.ajax({
          type: "POST", // Use POST to send data
          url: "/teachers/saveStudent", // URL to the controller endpoint
          contentType: "application/json", // Send data as JSON
          data: JSON.stringify(formData), // Serialize form data to JSON
          success: function (response) {
            // Handle successful response
            alert("Student saved successfully!");
            console.log("Response:", response);
            location.reload();
          },
          error: function (error) {
            // Handle errors
            alert("Error saving student.");
            console.log("Error:", error);
          },
        });
      });
    </script>


  </body>
</html>
