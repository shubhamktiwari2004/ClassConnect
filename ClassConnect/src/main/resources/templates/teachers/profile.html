<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Profile Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/plugins.min.css" />
  <link rel="stylesheet" href="/css/kaiadmin.min.css" />
  <style>
    body {
        margin-top: 20px;
        color: #1a202c;
        text-align: left;
        background-color: #e2e8f0;
    }
    .main-body {
        padding: 15px;
    }
    .card {
     width: 60%; /* Set the desired width */
    margin-left: auto; /* Automatically margin from left */
    margin-right: 0;  /* Align it to the right */
  }

    .card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .profile-section img {
        border-radius: 50%;
    }
    .details-section {
        margin-top: 20px;
        width: 80%;
    }
    .row + .row {
        margin-top: 10px;
    }
    .edit-button {
        margin-top: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  
  <!-- Include Sidebar -->
  <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>
  <div class="main-body">
    <div class="card">
      <div class="card-body">
        <!-- Profile Section -->
        <div class="profile-section">
          <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Admin" width="150">
          <div class="mt-3">
            <h4 th:text="${profile.name}">Xyz</h4>
            <p class="text-secondary mb-1">Full Stack Developer</p>
            <p class="text-muted font-size-sm">Bay Area, San Francisco, CA</p>
            <button class="btn btn-primary">Follow</button>
            <button class="btn btn-outline-primary">Message</button>
          </div>
        </div>

        <!-- Details Section -->
        <div class="details-section">
          <div class="row">
            <div class="col-sm-7"><h6>Full Name</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${profile.name}"></div>
          </div>
          <hr>
          <div class="row">
            <div class="col-sm-7"><h6>Email</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${profile.email}"></div>
          </div>
          <hr>
          <div class="row">
            <div class="col-sm-7"><h6>Mobile</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${profile.mobile}"></div>
          </div>
          <hr>
          <div class="row">
            <div class="col-sm-7"><h6>Address</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${profile.address}">Bay Area, San Francisco, CA</div>
          </div>
        </div>

        <!-- Edit Button -->
        <div class="edit-button">
          <form action="/teachers/editProfile" method="POST">
            <input type="hidden" name="teacherId" value="1731348323">
            <button type="submit" class="btn btn-info">Edit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (!sessionStorage.getItem("reloaded")) {
      sessionStorage.setItem("reloaded", "true");
      window.location.reload();
  } else {
      sessionStorage.removeItem("reloaded");
  }
</script>
</body>
</html>
