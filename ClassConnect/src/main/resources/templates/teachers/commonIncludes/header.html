<div th:fragment="headerContent" xmlns:th="http://www.w3.org/1999/xhtml">
<div class="main-header">
    <div class="main-header-logo">
        <!-- Logo Header -->
        <div class="logo-header" data-background-color="dark">
            <a href="/home" class="logo">
                <img
                        src="/img/kaiadmin/logo_light.svg"
                        alt="navbar brand"
                        class="navbar-brand"
                        height="20"
                />
                <!--<img
                        th:src="@{${profile.profile_image != null ? 'http://localhost:8080/' + profile.profile_image : 'https://bootdey.com/img/Content/avatar/avatar7.png'}}"
                        alt="navbar brand"
                        class="navbar-brand"
                        height="20"
                />-->
            </a>
            <div class="nav-toggle">
                <button class="btn btn-toggle toggle-sidebar">
                    <i class="gg-menu-right"></i>
                </button>
                <button class="btn btn-toggle sidenav-toggler">
                    <i class="gg-menu-left"></i>
                </button>
            </div>
            <button class="topbar-toggler more">
                <i class="gg-more-vertical-alt"></i>
            </button>
        </div>
        <!-- End Logo Header -->
    </div>
    <!-- Navbar Header -->
    <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom">
        <div class="container-fluid">
            <div class="navbar-form nav-search p-0 d-none d-lg-flex">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <button type="submit" class="btn btn-search pe-1">
                            <i class="fa fa-search search-icon"></i>
                        </button>
                    </div>
                    <input type="text" placeholder="Search ..." class="form-control" />
                </div>
            </div>

            <ul class="navbar-nav topbar-nav ms-md-auto align-items-center">
                <li class="nav-item topbar-user dropdown hidden-caret">
                    <a class="dropdown-toggle profile-pic" data-bs-toggle="dropdown" href="#">
                        <div class="avatar-sm">
                            <img src="/img/profile.jpg" alt="..." class="avatar-img rounded-circle" />
                        </div>
                        <span class="profile-username">
              <span class="op-7">Hi,</span>
              <span class="fw-bold" th:text="${session['teacherName']}">User</span>
            </span>
                    </a>
                    <ul class="dropdown-menu dropdown-user animated fadeIn">
                        <li>
                            <div class="user-box">
                                <div class="avatar-lg">
                                    <img src="/img/profile.jpg" alt="image profile" class="avatar-img rounded" />
                                </div>
                                <div class="u-text">
                                    <h4 th:text="${session['teacherName']}">Hizrian</h4>
                                    <p class="text-muted" th:text="${session['email']}">hello@example.com</p>
                                </div>
                            </div>
                        </li>
                        <li>
                            <div class="dropdown-divider"></div>
                            <form action="/teachers/profile" method="GET" style="display: inline;">
                                <button type="submit" style="background: none; border: none; color: inherit; cursor: pointer;">My Profile</button>

                            </form>

                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="/teachers/logout">Logout</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    <!-- End Navbar -->
</div>
</div>
