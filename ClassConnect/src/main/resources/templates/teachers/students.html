<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ClassConnect </title>
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
      name="viewport"
    />
    <link
      rel="icon"
      href="/img/kaiadmin/favicon.ico"
      type="image/x-icon"
    />
  <style>
    .card-container {
     display: flex;
     justify-content: center;
     align-items: center;
     margin: 20px;
   }

   .card {
    width: 110%; /* Increase this value to make the card wider */
    max-width: 1200px; /* Set a higher max-width to control the card's maximum size */
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    background-color: #fff;
    margin: 0 auto; /* Center the card horizontally */
}


   .card-content {
     padding: 20px;
   }

   table {
     width: 100%;
     border-collapse: collapse;
     text-align: center;
   }

   th, td {
     padding: 12px;
     border: 1px solid #ddd;
   }

   td img {
     width: 50px;
     height: 50px;
     border-radius: 50%;
     object-fit: cover;
   }

   th {
     background-color: #f4f4f4;
     color: #333;
   }
  </style>
    <!-- Fonts and icons -->
    <script src="/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/plugins.min.css" />
    <link rel="stylesheet" href="/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="/css/demo.css" />
    <!-- Include toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <!-- Include Sidebar -->
      <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>

      <div class="main-panel">
        <!-- Include header -->
        <div th:replace="~{'teachers/commonIncludes/header.html' :: headerContent}"></div>

        <div class="container">
          <div class="page-inner">
            <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
              <div>
                <h3 class="fw-bold mb-3">Students</h3>
              </div>
            </div>
            <div>
              <a class="btn btn-primary" href="/teachers/add_student/4">
                <i class="fas fa-plus" style="margin-right: 10px;"></i> Add Student
              </a>

            </div>
            <div class="card-container">
              <div class="card">
                <div class="card-content">

                    <div class="table-responsive mt-4">
                      <table class="table">
                        <tr>
                          <th>Sr. No.</th>
                          <th>Image</th>
                          <th>Roll No.</th>
                          <th>Student Name</th>
                          <th>View</th>
                        </tr>
                        <tr th:each="student : ${students}">
                          <td th:text="${student.id}"></td>
                          <td>
                            <img th:src="${student.image_url}" alt="Student Image" />
                          </td>
                          <td th:text="${student.id}"></td>
                          <td th:text="${student.firstName} + ' ' + ${student.lastName}"></td> <!-- Assuming you have a firstName and lastName property -->
                          <td><a th:href="@{/students/view/{id}(id=${student.id})}" title="View"><i class="fa fa-eye"></i></a></td>
                        </tr>
                      </table>
                    </div>
                </div>
              </div>
            </div>
          </div>
        </div>


      </div>
      </div>
    <!--   Core JS Files   -->
    <script src="/js/core/jquery-3.7.1.min.js"></script>
    <script src="/js/core/popper.min.js"></script>
    <script src="/js/core/bootstrap.min.js"></script>

    <!-- jQuery Scrollbar -->
    <script src="/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script>

    <!-- Chart JS -->
    <script src="/js/plugin/chart.js/chart.min.js"></script>

    <!-- jQuery Sparkline -->
    <script src="/js/plugin/jquery.sparkline/jquery.sparkline.min.js"></script>

    <!-- Chart Circle -->
    <script src="/js/plugin/chart-circle/circles.min.js"></script>

    <!-- Datatables -->
    <script src="/js/plugin/datatables/datatables.min.js"></script>

    <!-- Bootstrap Notify -->
    <script src="/js/plugin/bootstrap-notify/bootstrap-notify.min.js"></script>

    <!-- jQuery Vector Maps -->
    <script src="/js/plugin/jsvectormap/jsvectormap.min.js"></script>
    <script src="/js/plugin/jsvectormap/world.js"></script>

    <!-- Sweet Alert -->
    <script src="/js/plugin/sweetalert/sweetalert.min.js"></script>

    <!-- Kaiadmin JS -->
    <script src="/js/kaiadmin.min.js"></script>

    <!-- Kaiadmin DEMO methods, don't include it in your project! -->
    <script src="/js/setting-demo.js"></script>
    <script src="/js/demo.js"></script>
    <script>
      $(document).ready(function() {
        $.notify({
          // Notification content
          icon: 'fa fa-info-circle', // Optional icon
          title: 'Welcome!',
          message: 'Welcome to Students.',
        }, {
          // Notification options
          type: 'info',  // Type can be 'info', 'success', 'warning', 'danger'
          delay: 2000,  // Time in milliseconds before it disappears
          placement: {
            from: "top",
            align: "right"
          },
          offset: {
            x: 20, // X offset for positioning
            y: 60  // Y offset for positioning
          }
        });
      });
    </script>

    <script>
      $("#lineChart").sparkline([102, 109, 120, 99, 110, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#177dff",
        fillColor: "rgba(23, 125, 255, 0.14)",
      });

      $("#lineChart2").sparkline([99, 125, 122, 105, 110, 124, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#f3545d",
        fillColor: "rgba(243, 84, 93, .14)",
      });

      $("#lineChart3").sparkline([105, 103, 123, 100, 95, 105, 115], {
        type: "line",
        height: "70",
        width: "100%",
        lineWidth: "2",
        lineColor: "#ffa534",
        fillColor: "rgba(255, 165, 52, .14)",
      });
    </script>
      <!-- JavaScript function for redirection -->
    <script>
      function redirectToStudentList(id) {
    window.location.href = `/teachers/students_list/${id}`;

    </script>
    <script>
      $(document).ready(function() {
        // Handle success and error messages using toastr
        var errorMessage = /*[[${error}]]*/ '';
        var successMessage = /*[[${success}]]*/ '';

        if (errorMessage) {
          toastr.error(errorMessage);
        }

        if (successMessage) {
          toastr.success(successMessage);
        }
      });
    </script>
  </body>
</html>
