<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile Edit - Bootstrap</title>
	<link rel="icon" href="/img/kaiadmin/ClassConnect Logo.png" type="image/x-icon" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style type="text/css">
		body {
            background: #f7f7ff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 100%;
            padding: 20px;
            margin: 0;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #007bff;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 0.375rem;
            box-shadow: none;
            border: 1px solid #ced4da;
        }

        .btn-primary {
            border-radius: 0.375rem;
            padding: 10px 30px;
        }

        .main-body {
            width: 100%;
        }

        .card-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .row {
            margin-bottom: 15px;
        }

        .profile-container {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
		.edit-button {
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }
		.edit-button:focus,
        .edit-button:active {
            outline: none;
            border: none;
        }

	</style>
</head>
<body>
<div class="container profile-container">
	<div class="main-body">
		<div class="card">
			<div class="card-body">
				<form method="POST" action="/students/updateProfile" enctype="multipart/form-data">
					<div class="d-flex justify-content-center align-items-center mb-4 position-relative">
						<input type="hidden" name="image" th:value="${StudentProfile.image_url}">
						<input type="file" id="file-input" name = "image" accept="image/*" hidden onchange="updateImagePreview(event)">
						<div class="image-preview" id="image-preview">
							<button type="button" class="edit-button"  onclick="document.getElementById('file-input').click()">
								<img id="profile-img"
									 th:src="@{${StudentProfile.image_url != null ? @environment.getProperty('app.base-url') + StudentProfile.image_url : 'https://bootdey.com/img/Content/avatar/avatar7.png'}}"
									 alt="Profile Image"
									 class="profile-img">
								<!-- 'https://bootdey.com/img/Content/avatar/avatar6.png'-->
							</button>
						</div>
					</div>

					<div class="form-group row">



						<label for="firstName" class="col-sm-3 col-form-label form-label">First Name</label>
						<div class="col-sm-9">
							<input type="text" class="form-control" name="firstName" id="firstName" th:value="${StudentProfile.firstName}">
						</div>
					</div>
					<div class="form-group row">



						<label for="lastName" class="col-sm-3 col-form-label form-label">Last Name</label>
						<div class="col-sm-9">
							<input type="text" class="form-control" name="lastName" id="lastName" th:value="${StudentProfile.lastName}">
						</div>
					</div>

					<div class="form-group row">
						<label for="email" class="col-sm-3 col-form-label form-label">Email</label>
						<div class="col-sm-9">
							<input type="text" class="form-control" name="email" id="email" th:value="${StudentProfile.email}">
						</div>
					</div>

					<div class="form-group row">
						<label for="address" class="col-sm-3 col-form-label form-label">Address</label>
						<div class="col-sm-9">
							<input type="text" class="form-control" name="address" id="address" th:value="${StudentProfile.address}">
						</div>
					</div>

					<div class="form-group row">
						<div class="col-sm-3"></div>
						<div class="col-sm-9">
							<input type="hidden" name="studentId" th:value="${session['studentId']}">
							<button type="submit" class="btn btn-primary">Save Changes</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
	// Function to update the image preview when a new image is selected
	function updateImagePreview(event) {
		const file = event.target.files[0];
		if (file) {
			const reader = new FileReader();
			reader.onload = function(e) {
				document.getElementById('profile-img').src = e.target.result;
			};
			reader.readAsDataURL(file);
		}
	}
</script>
</body>
</html>
