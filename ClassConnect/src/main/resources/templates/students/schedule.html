<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>ClassConnect</title>
  <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
  <link rel="icon" href="/img/kaiadmin/favicon.ico" type="image/x-icon" />

  <!-- Fonts and icons -->
  <script src="/js/plugin/webfont/webfont.min.js"></script>
  <script>
    WebFont.load({
      google: { families: ["Public Sans:300,400,500,600,700"] },
      custom: {
        families: [
          "Font Awesome 5 Solid",
          "Font Awesome 5 Regular",
          "Font Awesome 5 Brands",
          "simple-line-icons",
        ],
        urls: ["/css/fonts.min.css"],
      },
      active: function () {
        sessionStorage.fonts = true;
      },
    });
  </script>
  <link rel="stylesheet" href="/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/plugins.min.css" />
  <link rel="stylesheet" href="/css/kaiadmin.min.css" />
  <link rel="stylesheet" href="/css/demo.css" />
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #f5f7fd;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .nav-tabs {
      display: flex;
      border-bottom: 2px solid #ddd;
      width: 100%;
    }

    .nav-tabs .nav-link {
      flex: 1;
      text-align: center;
      background: #f9f9f9;
      color: #333;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 0;
      margin-right: 0; /* Remove margin between tabs */
    }

    .nav-tabs .nav-link:not(:last-child) {
      border-right: 1px solid #ddd; /* Add divider between tabs */
    }

    .nav-tabs .nav-link.active {
      background: #fff;
      border: 2px solid #ddd;
      border-bottom: none;
      color: #000;
    }

    .tab-content {
      border: 2px solid #ddd;
      background: #fff;
      padding: 20px;
      margin-top: -2px;
    }

    .tab-card {
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
    }

    .schedule-card {
      box-sizing: border-box;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background: #fff;
      padding: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
      width: 48%;
      margin: 10px 1%;
    }

    .schedule-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .date-highlight {
      color: #ff7f50;
      font-weight: bold;
      font-size: 1.2em;
    }

    .topic-badge {
      background-color: #ff7f50;
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .time-info {
      margin-top: 15px;
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .nav-tabs {
        flex-direction: column; /* Stack tabs vertically */
      }

      .nav-tabs .nav-link {
        margin-bottom: 5px; /* Add spacing between vertical tabs */
        font-size: 1rem;
        padding: 10px;
      }

      .schedule-card {
        width: 100%;
        margin: 10px 0;
      }

      .tab-content {
        padding: 15px;
      }
    }

    @media (max-width: 576px) {
      .nav-tabs .nav-link {
        font-size: 0.85rem; /* Smaller font size on extra small screens */
        padding: 8px;
      }

      .schedule-header h3 {
        font-size: 1rem;
      }

      .topic-badge {
        font-size: 0.8em;
        padding: 4px 8px;
      }
    }
@media (min-width: 768px) {
  .nav-tabs .nav-link {
    width: 50%; /* On medium and larger screens, make each tab 50% of the width */
  }
}

@media (min-width: 992px) {
  .nav-tabs .nav-link {
    width: 509px; /* Fixed width for larger screens */
  }
}
  </style>

</head>
<body>
<!-- Sidebar -->
<div th:replace="~{'students/commonIncludes/leftNav.html' :: leftNavContent}"></div>

<div class="main-panel">
  <div th:replace="~{'students/commonIncludes/header.html' :: headerContent}"></div>

  <!-- Main Content -->
  <div class="container">
    <div class="page-inner">
      <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
        <h3 class="fw-bold mb-3">Schedule</h3>
      </div>
    <div class="card">
      <!-- Tabs for Schedule -->
      <ul class="nav nav-tabs" id="scheduleTabs" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" id="today-tab" data-toggle="tab" href="#today" role="tab" aria-controls="today" aria-selected="true">Today's Schedule</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="upcoming-tab" data-toggle="tab" href="#upcoming" role="tab" aria-controls="upcoming" aria-selected="false">Upcoming Schedule</a>
        </li>
      </ul>

      <div class="tab-content" id="scheduleTabsContent">
        <!-- Today's Schedule Tab -->
        <div class="tab-pane fade show active" id="today" role="tabpanel" aria-labelledby="today-tab">
          <div class="tab-card">
            <div class="row">
              <!-- Loop through today's schedule -->
              <div class="schedule-card" th:each="schedule : ${today_date}">
                <div class="schedule-header">
                  <!-- Display the date -->
                  <h3 class="date-highlight" th:text="${schedule.date}"></h3>
                  <!-- Display the topic -->
                  <span class="topic-badge" th:text="${schedule.topic}"></span>
                </div>
                <div class="card-content">
                  <p><strong>📘 Subject:</strong> <span th:text="${schedule.subject}"></span></p>
                  <p><strong>🏫 Class:</strong> <span th:text="${schedule.className}"></span></p>
                  <p><strong>📍 Room Number:</strong> <span th:text="${schedule.roomNumber}"></span></p>
                  <p><strong>📝 Notes:</strong> <span th:text="${schedule.notes}"></span></p>
                </div>
                <div class="time-info">
                  <p><strong>⏰ Start Time:</strong> <span th:text="${schedule.startTime}"></span></p>
                  <p><strong>⏰ End Time:</strong> <span th:text="${schedule.endTime}"></span></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Upcoming Schedule Tab -->
        <div class="tab-pane fade" id="upcoming" role="tabpanel" aria-labelledby="upcoming-tab">
          <div class="tab-card">
            <div class="row">
              <!-- Loop through upcoming schedule -->
              <div class="schedule-card" th:each="schedule : ${upcoming_date}">
                <div class="schedule-header">
                  <!-- Display the date -->
                  <h3 class="date-highlight" th:text="${schedule.date}"></h3>
                  <!-- Display the topic -->
                  <span class="topic-badge" th:text="${schedule.topic}"></span>
                </div>
                <div class="card-content">
                  <p><strong>📘 Subject:</strong> <span th:text="${schedule.subject}"></span></p>
                  <p><strong>🏫 Class:</strong> <span th:text="${schedule.className}"></span></p>
                  <p><strong>📍 Room Number:</strong> <span th:text="${schedule.roomNumber}"></span></p>
                  <p><strong>📝 Notes:</strong> <span th:text="${schedule.notes}"></span></p>
                </div>
                <div class="time-info">
                  <p><strong>⏰ Start Time:</strong> <span th:text="${schedule.startTime}"></span></p>
                  <p><strong>⏰ End Time:</strong> <span th:text="${schedule.endTime}"></span></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{'students/commonIncludes/footer.html' :: footerContent}"></div>
</div>

<!-- Core JS -->
<script src="/js/core/jquery-3.7.1.min.js"></script>
<script src="/js/core/popper.min.js"></script>
<script src="/js/core/bootstrap.min.js"></script>
<script>
  $(document).ready(function () {
   $('#scheduleTabs a').on('click', function (e) {
     e.preventDefault();
     $(this).tab('show');
   });
 });
</script>
</body>
</html>
