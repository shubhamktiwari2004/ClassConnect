<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" href="/img/kaiadmin/ClassConnect Logo.png" type="image/x-icon" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to right, #f9f9f9, #d6d6d6); /* Gradient from light gray to a darker gray */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }

        p {
            font-size: 16px;
            color: #777;
            margin-bottom: 35px;
        }

        input[type=password], button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type=password]:focus {
            border-color: #0072ff;
            box-shadow: 0 0 10px rgba(0, 114, 255, 0.3);
        }

        button {
            background: linear-gradient(45deg, #0072ff, #00c6ff); /* Gradient button */
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.2);
        }

        button:hover {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.3);
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }

        .alert-danger {
            background-color: #f44336;
            color: white;
        }

        .alert-success {
            background-color: #4CAF50;
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px;
                max-width: 90%;
            }

            h2 {
                font-size: 24px;
            }

            button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Your Password</h2>
    <p>Enter your new password below and confirm it.</p>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <form th:action="@{/students/resetPasswordConfirm}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <input type="password" name="newPassword" placeholder="Enter new password" required minlength="8">
        <input type="password" name="confirmPassword" placeholder="Confirm new password" required minlength="8">
        <button type="submit">Save New Password</button>
    </form>
</div>
</body>
</html>
