<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Link Expired</title>
    <link rel="icon" href="/img/kaiadmin/ClassConnect Logo.png" type="image/x-icon" />

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to right, #f9f9f9, #d6d6d6); /* Gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #e74c3c;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(1);
        }
        .alert {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            color: #fff;
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Link Expired</h2>
    <p>The password reset link has expired or the page you are looking for has timed out.</p>
    <p>Please request a new password reset link if you still need to reset your password.</p>
    <a href="/students/forgetPassword"><button>Request New Link</button></a>
</div>
</body>
</html>
