<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Profile Page</title>
  <link rel="icon" href="/img/kaiadmin/ClassConnect Logo.png" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/plugins.min.css" />
  <link rel="stylesheet" href="/css/kaiadmin.min.css" />
  <style>
    body {
        margin-top: 20px;
        color: #1a202c;
        text-align: left;
        background-color: #e2e8f0;
    }
    .main-body {
        padding: 15px;
    }
    .card {
     width: 60%; /* Set the desired width */
    margin-left: auto; /* Automatically margin from left */
    margin-right: 0;  /* Align it to the right */
  }

    .card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .profile-section img {
        border-radius: 50%;
    }
    .details-section {
        margin-top: 20px;
        width: 80%;
    }
    .row + .row {
        margin-top: 10px;
    }
    .edit-button {
        margin-top: 20px;
    }
    .profile-img {
    width: 150px;  /* Adjust size as needed */
    height: 150px; /* Keep height equal to width for a perfect circle */
    border-radius: 50%;
    object-fit: cover; /* Ensures the image scales without distortion */
    border: 2px solid #ddd; /* Optional: Add a border for better appearance */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Optional: Add a shadow */
}

  </style>
</head>
<body>
<div class="container">

  <!-- Include Sidebar -->
  <div th:replace="~{'teachers/commonIncludes/leftNav.html' :: leftNavContent}"></div>
  <div class="main-body">
    <div class="card">
      <div class="card-body">
        <!-- Profile Section -->
        <div class="d-flex justify-content-center align-items-center mb-4 position-relative">
          <div class="image-preview" id="image-preview">
            <img id="profile-img"
                 th:src="@{${StudentProfile.image_url != null ? @environment.getProperty('app.base-url') + StudentProfile.image_url : 'https://bootdey.com/img/Content/avatar/avatar7.png'}}"
                 alt="Profile Image"
                 class="profile-img"
                 >
          </div>

        </div>
        <div class="mt-3">
          <h4 th:text="${StudentProfile.firstName} + ' '+ ${StudentProfile.lastName}">Xyz</h4>

        </div>

        <!-- Details Section -->
        <div class="details-section">
          <div class="row">
            <div class="col-sm-7"><h6>Full Name</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${StudentProfile.firstName} + ' '+ ${StudentProfile.lastName}"></div>
          </div>
          <hr>
          <div class="row">
            <div class="col-sm-7"><h6>Email</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${StudentProfile.email}"></div>
          </div>
          <hr>
          <!--<div class="row">
            <div class="col-sm-7"><h6>Mobile</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${StudentProfile.mobile}"></div>
          </div>
          <hr>-->
          <div class="row">
            <div class="col-sm-7"><h6>Address</h6></div>
            <div class="col-sm-3 text-secondary" th:text="${StudentProfile.address}">Bay Area, San Francisco, CA</div>
          </div>
        </div>

        <!-- Edit Button -->
        <div class="edit-button">
          <form action="/students/editProfile" method="GET">
<!--            <input type="hidden" name="studentId" value="${session['studentId']}">-->
            <button type="submit" class="btn btn-info">Edit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (!sessionStorage.getItem("reloaded")) {
      sessionStorage.setItem("reloaded", "true");
      window.location.reload();
  } else {
      sessionStorage.removeItem("reloaded");
  }
</script>
</body>
</html>
